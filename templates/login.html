<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sameer | Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="login-body">


<div class="login-container">


    <div class="login-card">


        <div class="login-logo">
            S
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="login-subtitle">
            Sameer's Portfolio Admin
        </p>


        {% if error %}

        <div class="login-error">
            ⚠️ {{ error }}
        </div>

        {% endif %}


        <form
            action="{{ url_for('login') }}"
            method="POST"
        >


            <label>
                👤 Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                🔐 Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                🔓 Login to Dashboard
            </button>


        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-home"
        >
            ← Back to Portfolio
        </a>


    </div>


</div>


</body>

</html>
